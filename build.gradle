plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'br.com.criarCenarioTestesApiTests'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

allure {
    adapter {
        allureJavaVersion = '2.35.2'
        autoconfigure = true
        autoconfigureListeners = true
        resultsDir = layout.buildDirectory.dir('allure-results')

        frameworks {
            testng {
                enabled = true
            }
        }
    }

    report {
        dependsOnTests = true
        reportDir.set(layout.buildDirectory.dir('allure-report'))
    }
}

dependencies {
    implementation 'io.rest-assured:rest-assured:5.5.0'
    implementation 'org.yaml:snakeyaml:2.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.slf4j:slf4j-simple:2.0.16'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'org.testng:testng:7.10.2'
    testImplementation 'io.qameta.allure:allure-testng:2.35.2'
    testImplementation 'io.qameta.allure:allure-rest-assured:2.35.2'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

// Carrega um .env opcional do próprio projeto. Sem isso, a configuração só
// chegava por variável de ambiente exportada — o que funciona no Jenkins mas
// quebra ao rodar pela IDE (que não herda o ~/.zshrc) e obriga a passar tudo
// com -D na mão no terminal. O arquivo é ignorado pelo git (.gitignore).
def dotenv = [:]
def dotenvFile = file('.env')
if (dotenvFile.exists()) {
    dotenvFile.eachLine { linha ->
        def texto = linha.trim()
        if (texto.isEmpty() || texto.startsWith('#')) {
            return
        }
        def separador = texto.indexOf('=')
        if (separador <= 0) {
            return
        }
        def chave = texto.substring(0, separador).trim()
        def valor = texto.substring(separador + 1).trim()
        // Aceita valores entre aspas, como o formato .env usual.
        if (valor.length() >= 2
                && ((valor.startsWith('"') && valor.endsWith('"'))
                || (valor.startsWith("'") && valor.endsWith("'")))) {
            valor = valor.substring(1, valor.length() - 1)
        }
        dotenv[chave] = valor
    }
    logger.lifecycle("Configuração carregada de .env (${dotenv.size()} chaves).")
}

// Precedência: -D na linha de comando > variável de ambiente > .env local.
// A ordem importa: o CI exporta variáveis de ambiente e não deve ser
// sobrescrito por um .env que porventura exista no workspace.
def resolverConfig = { String systemProperty, String envVar ->
    System.getProperty(systemProperty) ?: System.getenv(envVar) ?: dotenv[envVar] ?: ''
}

tasks.withType(Test).configureEach {

    useTestNG()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty(
            'allure.results.directory',
            layout.buildDirectory
                    .dir('allure-results')
                    .get()
                    .asFile
                    .absolutePath
    )

    // Repassa a URL base da API sob teste, se informada pelo ambiente/CI/.env.
    systemProperty 'api.baseUrl', resolverConfig('api.baseUrl', 'API_BASE_URL')

    // Repassa credenciais/URL do Zephyr Scale para a verificação e2e real
    // (ZephyrPublishingTest), se informadas pelo ambiente/CI/.env.
    systemProperty 'zephyr.baseUrl', resolverConfig('zephyr.baseUrl', 'ZEPHYR_BASE_URL')
    systemProperty 'zephyr.apiToken', resolverConfig('zephyr.apiToken', 'ZEPHYR_API_TOKEN')

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

tasks.register('testSmoke', Test) {
    description = 'Suite rápida e determinística (sem dependência de IA/Jira reais) — usada no pipeline de merge para develop.'
    group = 'verification'

    useTestNG {
        suites 'src/test/resources/testng-smoke.xml'
    }
}

tasks.register('testRegression', Test) {
    description = 'Suite completa, incluindo cenários end-to-end que dependem de IA/Mongo/Jira reais.'
    group = 'verification'

    useTestNG {
        suites 'src/test/resources/testng-regression.xml'
    }
}

tasks.register('testWorkflow', Test) {
    description = 'Executa os testes de listagem de workflows.'
    group = 'verification'
    include '**/workflow/**'
}

tasks.register('testCenario', Test) {
    description = 'Executa os testes de cenário.'
    group = 'verification'
    include '**/cenario/**'
}

tasks.register('testJira', Test) {
    description = 'Executa os testes de integração com Jira.'
    group = 'verification'
    include '**/jira/**'
}

tasks.register('testAgent', Test) {
    description = 'Executa os testes de agentes de IA.'
    group = 'verification'
    include '**/agent/**'
}

tasks.register('testAutoQa', Test) {
    description = 'Executa os testes do ciclo de execução Auto QA.'
    group = 'verification'
    include '**/autoqa/**'
}

tasks.register('testZephyr', Test) {
    description = 'Executa a verificação e2e real de publicação no Zephyr Scale (desabilitada por padrão).'
    group = 'verification'
    include '**/zephyr/**'
}

test {
    description = 'Executa todos os testes automatizados (equivalente à suite de regressão).'
    useTestNG {
        suites 'src/test/resources/testng-regression.xml'
    }
}
